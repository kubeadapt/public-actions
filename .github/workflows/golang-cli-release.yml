name: Go CLI Release

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version to use'
        type: string
        default: '1.26.x'
    secrets:
      PLATFORM_ASSISTANT_GH_APP_ID:
        required: true
      PLATFORM_ASSISTANT_GH_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a public-actions commit instead of @main. A reusable workflow
      # called from another repository cannot use a relative ./ path for this
      # composite, so it is referenced by SHA. Bump the SHA after every change
      # to the composite action (including its own action pins).
      - uses: kubeadapt/public-actions/.github/actions/golang-cli-release@980b8e0893622649030af5091c741f8f4e1d0fe1
        with:
          go_version: ${{ inputs.go_version }}
          PLATFORM_ASSISTANT_GH_APP_ID: ${{ secrets.PLATFORM_ASSISTANT_GH_APP_ID }}
          PLATFORM_ASSISTANT_GH_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_ASSISTANT_GH_APP_PRIVATE_KEY }}
